; ============================================================
;  IMPORT DEFAULTS — PIXEL-ART SPRITES
;  Every PNG placed in assets/sprites/ MUST use these settings.
;  The sprite_importer editor plugin (addons/sprite_importer/)
;  applies them automatically.
; ============================================================

; These settings are per-resource overrides applied via the
; .import file generated by Godot's texture importer.
;
; IMPORT_PARAMS_TEXTURE (2D Texture):
;   compress/mode          = 0            (Lossless)
;   compress/lossy_quality = 0.0
;   detect_3d              = false
;   mipmaps/generate       = false
;   flags/repeat           = false
;   flags/filter           = false        (Nearest / pixel-perfect)
;   svg/scale              = 1.0
;
; MANUAL CONFIGURATION (if no plugin):
;   1. Select any .png in assets/sprites/
;   2. Import dock → Preset → "2D Pixel"
;   3. Uncheck "Mipmaps", ensure Filter = "Nearest"
;   4. Re-import

; The sprite_importer editor plugin automates this and also
; validates that all sprites are 800×448 px (or 800×N×64).
